<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusOnIt Legal</title>
  <style>
    :root {
      color-scheme: light dark;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --bg: #ffffff;
      --border: #e5e5ea;
      --link: #0071e3;
      --card: #f5f5f7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f5f5f7;
        --muted: #a1a1a6;
        --bg: #1c1c1e;
        --border: #38383a;
        --link: #2997ff;
        --card: #2c2c2e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.65;
      color: var(--text);
      background: var(--bg);
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px 64px;
    }
    h1 { font-size: 2rem; line-height: 1.25; margin-bottom: 0.25rem; }
    .meta { color: var(--muted); margin-bottom: 2rem; }
    .links {
      display: grid;
      gap: 12px;
    }
    .links a {
      display: block;
      color: var(--text);
      text-decoration: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
    }
    .links a strong { color: var(--link); }
  </style>
</head>
<body>
  <main>
    <h1>FocusOnIt</h1>
    <p class="meta">专注猫猫 · Legal pages for App Store Connect</p>
    <div class="links">
      <a href="privacy.html"><strong>Privacy Policy / 隐私政策</strong><br>How we handle information on your device.</a>
      <a href="support.html"><strong>Support / 技术支持</strong><br>Help, permissions, VIP, and contact email.</a>
      <a href="terms.html"><strong>Terms of Use / 用户协议</strong><br>License, subscriptions, and auto-renewal.</a>
    </div>
  </main>
</body>
</html>
